name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Executar testes
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK de depuração
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: GuiaVoz-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar versão 0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.0 >/dev/null 2>&1 || \
            gh release create v0.2.0 \
              --title "GuiaVoz 0.2.0" \
              --notes "Versão de teste com leitura de notificações, ligação e reprodução assistida de áudios do WhatsApp comum em português do Brasil."
          gh release upload v0.2.0 \
            "app/build/outputs/apk/debug/app-debug.apk#GuiaVoz-v0.2.0.apk" \
            --clobber
