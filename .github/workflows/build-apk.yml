name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: guia-voz-main
  cancel-in-progress: true

jobs:
  build:
    name: APK de teste
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Treinar e validar o cérebro local
        run: |
          python -m pip install --disable-pip-version-check -r training/requirements.txt
          python training/test_brain.py
          python training/train_brain.py
          python training/check_quality.py --minimum 0.90

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Executar testes
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK de depuração
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: GuiaVoz-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar versão 0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.5.0 >/dev/null 2>&1 || \
            gh release create v0.5.0 \
              --title "GuiaVoz 0.5.0 — diálogo e capacidades" \
              --notes "Cérebro hierárquico treinado antes da compilação, envio e resposta no WhatsApp com confirmação, registro local de erros, scanner de apps, registro online de capacidades, papel de assistente padrão e interface Material 3."
          gh release upload v0.5.0 \
            "app/build/outputs/apk/debug/app-debug.apk#GuiaVoz-v0.5.0.apk" \
            --clobber
